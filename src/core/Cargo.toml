[package]
name = "zhibi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
png = "0.17"
serde_json = "1"
# 只要 deflate。`deflate-flate2` 本身不选压缩后端，用的是 png 已经带进来的
# flate2 默认后端（纯 Rust 的 miniz_oxide），所以不会多出别的压缩库。
# 版本定在 8.6：9.0 是 2026-10-09 才发布的大版本，等它稳定一阵再升。
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
